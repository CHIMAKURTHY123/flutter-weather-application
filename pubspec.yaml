name: weather_application
description: Flutter weather application using GetX, Dio, GetStorage and Firebase.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  dio: ^5.11.1
  get_storage: ^2.1.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  flutter_dotenv: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env



